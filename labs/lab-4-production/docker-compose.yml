services:
  backend:
    build:
      context: ../..
      dockerfile: labs/lab-4-production/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
